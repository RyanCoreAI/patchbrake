name: PatchBrake
description: Scan pull request diffs for risky AI-generated patch patterns.
author: PatchBrake contributors
inputs:
  base:
    description: Base git ref to compare from.
    required: false
    default: origin/main
  head:
    description: Head git ref to compare to.
    required: false
    default: HEAD
  version:
    description: npm version to install. Pin this to the same version as the Action tag for reproducible runs.
    required: false
    default: "0.2.0"
  format:
    description: Output format, text, json, or sarif.
    required: false
    default: text
  output:
    description: Optional output file path.
    required: false
    default: ""
  fail-on:
    description: Fail on warn, error, or never.
    required: false
    default: error
  allow-custom-rules:
    description: Allow loading local custom rule modules from the checked-out repository.
    required: false
    default: "false"
  allow-inline-ignore:
    description: Allow patchbrake-ignore comments in the diff to suppress findings.
    required: false
    default: "false"
  fail-on-new-ignore:
    description: Fail when the diff adds patchbrake inline ignore comments.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Install PatchBrake
      shell: bash
      env:
        PATCHBRAKE_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        if [[ ! "$PATCHBRAKE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
          echo 'PatchBrake version must be a pinned npm semver version.' >&2
          exit 2
        fi
        npm install -g "patchbrake@$PATCHBRAKE_VERSION" --ignore-scripts
    - name: Run PatchBrake
      shell: bash
      env:
        PATCHBRAKE_BASE: ${{ inputs.base }}
        PATCHBRAKE_HEAD: ${{ inputs.head }}
        PATCHBRAKE_FORMAT: ${{ inputs.format }}
        PATCHBRAKE_FAIL_ON: ${{ inputs.fail-on }}
        PATCHBRAKE_OUTPUT: ${{ inputs.output }}
        PATCHBRAKE_ALLOW_CUSTOM_RULES: ${{ inputs.allow-custom-rules }}
        PATCHBRAKE_ALLOW_INLINE_IGNORE: ${{ inputs.allow-inline-ignore }}
        PATCHBRAKE_FAIL_ON_NEW_IGNORE: ${{ inputs.fail-on-new-ignore }}
      run: |
        set -euo pipefail
        for flag in "$PATCHBRAKE_ALLOW_CUSTOM_RULES" "$PATCHBRAKE_ALLOW_INLINE_IGNORE" "$PATCHBRAKE_FAIL_ON_NEW_IGNORE"; do
          if [[ "$flag" != true && "$flag" != false ]]; then
            echo 'PatchBrake boolean inputs must be true or false.' >&2
            exit 2
          fi
        done
        args=(scan --base "$PATCHBRAKE_BASE" --head "$PATCHBRAKE_HEAD" --format "$PATCHBRAKE_FORMAT" --fail-on "$PATCHBRAKE_FAIL_ON")
        if [ -n "$PATCHBRAKE_OUTPUT" ]; then
          args+=(--output "$PATCHBRAKE_OUTPUT")
        fi
        if [ "$PATCHBRAKE_ALLOW_CUSTOM_RULES" != "true" ]; then
          args+=(--no-custom-rules)
        fi
        if [ "$PATCHBRAKE_ALLOW_INLINE_IGNORE" != "true" ]; then
          args+=(--disallow-inline-ignore)
        fi
        if [ "$PATCHBRAKE_FAIL_ON_NEW_IGNORE" = "true" ]; then
          args+=(--fail-on-new-ignore)
        fi
        patchbrake "${args[@]}"
